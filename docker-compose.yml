services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: doclens
      POSTGRES_PASSWORD: doclens
      POSTGRES_DB: doclens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doclens"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://doclens:doclens@db:5432/doclens
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CHAT_MODEL: gemini-2.5-flash
      EMBEDDING_MODEL: models/gemini-embedding-001
      EMBEDDING_DIMENSION: "768"
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"

volumes:
  pgdata:
